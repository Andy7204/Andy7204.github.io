name: Build Todo APK

on:
  push:
    paths:
      - "todo-app/**"
      - ".github/workflows/todo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Todo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Todo-apk
          path: todo-app/Todo.apk

      - name: Publish to "todo-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: todo-latest
          target_commitish: ${{ github.sha }}
          name: Todo app (latest build)
          body: |
            Latest build of the Todo Android app from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **Todo.apk** on your phone and open it to install.
          files: todo-app/Todo.apk
          make_latest: true

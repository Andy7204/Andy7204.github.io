name: Build Todo app

on:
  push:
    paths:
      - "todo-app/**"
      - ".github/workflows/todo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease --no-daemon

      - name: Build sideload APK
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Todo.apk

      - name: Build Play Store bundle (signed with the private upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload-key.jks"
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab Todo-play.aab
          rm -f "$RUNNER_TEMP/upload-key.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Todo-apk
          path: todo-app/Todo.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: Todo-play-bundle
          path: todo-app/Todo-play.aab

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: todo-app/app/build/reports

      - name: Publish APK to "todo-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: todo-latest
          target_commitish: ${{ github.sha }}
          name: Todo app (latest build)
          body: |
            Latest build of the Todo Android app from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **Todo.apk** on your phone and open it to install.
          files: todo-app/Todo.apk
          make_latest: true

/* ---------- number formatting ---------- */

/* ---------- game data ---------- */

};

 {e:'🐉',t:'Dragon Sighting',d:'A dragon circles your island. Offer tribute, or try to befriend it?',sa:'Offer tribute',ss:55,ra:'Befriend the dragon',rp:.4,rs:150,rb:[5,20]},
 {e:'🏴‍☠️',t:'Sky Pirates',d:'Pirates approach! Pay the toll, or bluff them into dropping their loot.',sa:'Pay the toll (they pay you back)',ss:50,ra:'Bluff them',rp:.5,rs:210},

var S={best:0,ver:8,gold:0,life:0,taps:0,era:0,mood:40,plots:[],lastSeen:nowMs(),streak:0,lastDay:'',muted:false,decrees:0,asp:null,aspDone:0,play:0,glory:0,mil:0,wins:0,raidsHeld:0,raidsLost:0,crowned:false,conq:{},stand:1,peakL:0,sPeak:0,tokens:3,tokT:nowMs(),chests:[null,null,null,null],units:[0,0,0],q:null,season:-1,titles:[],skins:{},skin:0,shieldUntil:0,surgeUntil:0,aspMul:1,seen:{},endSeen:false,ar:{tr:0,best:0,w:0,l:0,st:0,k:0,pl:0},nick:''};

/* ---------- derived stats ---------- */
function calc(){
  var cit=3,mk=0,tp=0,wd=0,fm=0,fg=0,hb=0,ac=0;
  for(var i=0;i<S.plots.length;i++){
    var p=S.plots[i];if(!p.type||p.dmg)continue;
    var e=eff(p.lvl);
    if(p.type==='house')cit+=4*e;else if(p.type==='market')mk+=e;else if(p.type==='temple')tp+=e;else if(p.type==='farm')fm+=e;else if(p.type==='forge')fg+=e;else if(p.type==='harbor')hb+=e;else if(p.type==='academy')ac+=e;else wd+=e;

  R.fgB=1+Math.min(1.5,K.fg*fg);R.acB=1+Math.min(1.5,K.ac*ac);
  R.ips=(0.5+Math.pow(cit,.93)*0.3*(1+Math.min(2,K.hb*hb))+mk*2+fm*1.3)*mm*(1+K.wd*wd)*Math.pow(1.2,S.era)*(1+K.eb*Math.max(0,1-S.play/K.et));

}
function builtCount(){var c=0;for(var i=0;i<6;i++)if(S.plots[i].type)c++;return c;}

/* ---------- YouTube Playables SDK (safe wrappers) ---------- */
function yt(){try{return (typeof ytgame!=='undefined'&&ytgame)?ytgame:null;}catch(e){return null;}}
function ytCall(ns,fn,a){
  try{var g=yt();if(g&&g[ns]&&typeof g[ns][fn]==='function'){var r=g[ns][fn](a);if(r&&r.catch)r.catch(function(){});return r;}}catch(e){}
}
var sysAudio=true,ONYT=false;
function audioApply(){try{if(!AC)return;if(R.paused||!sysAudio){if(AC.state==='running')AC.suspend();}else if(AC.state==='suspended')AC.resume();}catch(e){}}
function initSystem(){
  try{
    var g=yt();if(!g||!g.system)return;

    if(g.system.onPause)g.system.onPause(function(){R.paused=true;R.awayFrom=nowMs();audioApply();save(true);flushScore();});
    if(g.system.onResume)g.system.onResume(function(){R.paused=false;lastTs=0;audioApply();checkAway();});
  }catch(e){}
  try{window.addEventListener('error',function(e){try{if(yt()&&yt().health)yt().health.logError();}catch(x){}});
      window.addEventListener('unhandledrejection',function(){try{if(yt()&&yt().health)yt().health.logWarning();}catch(x){}});}catch(e){}
}
var lastSave=0,saveTO=0,lastSent=-1;
function flushScore(){
  var v=Math.floor(Math.min(S.best||0,Number.MAX_SAFE_INTEGER));
  if(v>lastSent&&v>0&&R.loaded){lastSent=v;ytCall('engagement','sendScore',{value:v});}
}
/* ---------- save / load ---------- */
function save(force){
  if(!R.loaded)return;
  var n=Date.now();
  if(!force&&n-lastSave<3000){if(!saveTO)saveTO=setTimeout(function(){saveTO=0;save(true);},3000-(n-lastSave)+20);return;}
  lastSave=n;
  var pw=powerOf();if(pw>(S.best||0))S.best=pw;
  S.lastSeen=nowMs();S.ver=8;
  var str;try{str=JSON.stringify(S);}catch(e){return;}
  var g=yt();
  if(g&&g.game&&typeof g.game.saveData==='function'){
    if(str.length>1500000)return;
    if(str.isWellFormed&&!str.isWellFormed())str=str.toWellFormed();
    ytCall('game','saveData',str);
  }
  else{try{localStorage.setItem(KEY,str);}catch(e){}}
}
function loadSave(){
  var g=yt(),p;
  if(g&&g.game&&typeof g.game.loadData==='function'){
    p=Promise.resolve(g.game.loadData()).then(function(x){return x?JSON.parse(x):null;});
  }else{
    p=Promise.resolve().then(function(){var x=localStorage.getItem(KEY);return x?JSON.parse(x):null;});
  }
  return Promise.race([p.catch(function(){return null;}),new Promise(function(r){setTimeout(function(){r(null);},2500);})]);
}
function applySave(d){
  if(!d||typeof d!=='object')return;
  var num=function(v,def){v=+v;return isFinite(v)&&v>=0?v:def;};

  S.mood=clamp(num(d.mood,40),0,100);S.lastSeen=num(d.lastSeen,nowMs());

var shSig='x';
function closeSheet(){R.sel=-1;R.demoI=-1;renderSheet(true);}
function demoBtn(p){var cf=R.demoI===R.sel;return '<button class="buy" style="margin-top:7px;background:'+(cf?'#b5342a':'#3a3f6e')+';font-size:13px;padding:8px" data-act="demo">'+(cf?'⚠️ Tap again to demolish · +🪙 '+fmt(demoRefund(p))+' refund':'🗑️ Demolish · build something else')+'</button>';}
function renderSheet(force){
  var el=$('sheet');
  if(R.sel===-1||R.modalOpen){if(shSig!=='x'){el.classList.remove('open');shSig='x';}return;}
  if(R.sel===-2){renderMil(force);return;}
  var p=S.plots[R.sel],sig=R.sel+'|'+(p.type||'-')+'|'+p.lvl+'|'+S.era+'|'+(R.demoI===R.sel?'D':'')+'|'+(p.dmg?'d'+(S.gold>=rebuildCost()?1:0):'')+'|',i;
  if(!p.type){for(i=0;i<TKEYS.length;i++)sig+=(S.gold>=cost(TKEYS[i],0)?1:0);}
  else sig+=(S.gold>=cost(p.type,p.lvl)?1:0);
  if(!force&&sig===shSig)return;
  shSig=sig;
  var h='';
  if(!p.type){
    h+='<div class="shHead"><b>Choose a building</b><button data-act="close">✕</button></div><div class="cards">';
    for(i=0;i<TKEYS.length;i++){
      var k=TKEYS[i],T=TYPES[k],lock=T.unlock>S.era,can=!lock&&S.gold>=cost(k,0);
      h+='<button class="card '+(lock?'lock':can?'can':'')+'" data-act="build" data-type="'+k+'"><i>'+T.ic+'</i><b>'+T.n+'</b><small>'+(lock?'🔒 Unlocks in Era '+T.unlock:T.desc(1))+'</small>'+(lock?'':'<span class="cost">🪙 '+fmt(cost(k,0))+'</span>')+'</button>';
    }
    h+='</div>';
  }else if(p.dmg){
    h+='<div class="shHead"><b>💥 Damaged '+TYPES[p.type].n+'</b><button data-act="close">✕</button></div><div class="up"><div class="ms">Raiders wrecked this building — it earns nothing until rebuilt.</div><button class="buy '+(S.gold>=rebuildEach()?'can':'')+'" data-act="up">🔨 Rebuild · 🪙 '+fmt(rebuildEach())+' each ('+fmt(rebuildCost())+' total)</button>'+demoBtn(p)+'</div>';
  }else{
    var T2=TYPES[p.type],c=cost(p.type,p.lvl),nm=(Math.floor(p.lvl/5)+1)*5,can2=S.gold>=c;
    h+='<div class="shHead"><b>'+T2.ic+' '+T2.n+' · Level '+p.lvl+'</b><button data-act="close">✕</button></div>';
    h+='<div class="up"><div class="stat">'+T2.desc(p.lvl)+' → <em>'+T2.desc(p.lvl+1)+'</em></div>';
    h+='<div class="ms">⭐ Level '+nm+': ×1.5 power ('+(nm-p.lvl)+' to go)<div class="bar"><i style="width:'+((p.lvl%5)/5*100)+'%"></i></div></div>';
    h+='<button class="buy '+(can2?'can':'')+'" data-act="up">Upgrade · 🪙 '+fmt(c)+'</button>'+demoBtn(p)+'</div>';
  }
  el.innerHTML=h;el.classList.add('open');
}

function demoRefund(p){var r=0,l;for(l=0;l<p.lvl;l++)r+=cost(p.type,l);return Math.floor(r*.5);}
function demolish(i){
  var p=S.plots[i];if(!p||!p.type)return;
  if(R.demoI!==i){R.demoI=i;R.demoT=R.T;renderSheet(true);return;}
  var rf=demoRefund(p),bx=PV[i].x,by=PV[i].y-24*s+R.bob;
  S.plots[i]={type:null,lvl:0,dmg:0};R.demoI=-1;gain(rf);S.life-=rf;
  spark(bx,by,'#c9b79a',22,220);ring(PV[i].x,PV[i].y+R.bob,'#e0d2b8',60);ftext(bx,by-10*s,'+'+fmt(rf)+' refund','#9dff9d',15);sfx.fail();tone(150,.25,'sawtooth',.05,-50);
  calc();syncCitizens();R.qbT=0;closeSheet();R.sel=i;renderSheet(true);save();
}
function build(i,type){
  var p=S.plots[i];if(!p||!TYPES[type])return;
  if(p.dmg){rebuildAll(false);renderSheet(true);return;}
  if(p.type&&p.type!==type)return;
  var T=TYPES[type];if(T.unlock>S.era)return;
  var c=cost(type,p.lvl);
  if(S.gold<c){sfx.fail();return;}
  R.qbT=0;S.gold-=c;p.type=type;p.lvl++;
  PV[i].pop=1;if(p.lvl===1)PV[i].drop=1;
  var bx=PV[i].x,by=PV[i].y-24*s+R.bob;
  spark(bx,by,'#ffd34d',14,170);ring(PV[i].x,PV[i].y+R.bob,'#ffe9a0',54);
  ftext(bx,by-10*s,'-'+fmt(c),'#ff9f9f',15);
  sfx.buy();
  if(p.lvl%5===0){
    confetti(bx,by,36);sfx.win();R.shake=8;
    banner(T.ic+' '+T.n+' Lv '+p.lvl,'×1.5 POWER!','Milestone reached');
    cheer();
  }
  calc();syncCitizens();
  var g=PV[i];if(g)g.pop=1;
  qInc('bld');renderSheet(true);save();
}

function tapHeart(){

function pickEvent(){var i;do{i=(Math.random()*EVENTS.length)|0;}while(i===R.lastEv&&EVENTS.length>1);R.lastEv=i;return EVENTS[i];}
function openDecree(){
  if(!R.decreeReady||R.modalOpen)return;
  var ev=pickEvent(),G=Math.max(R.ips,2);
  R.ev=ev;R.evVals={safe:Math.floor(G*ev.ss*.35),risk:Math.floor(G*ev.rs*.35),cons:Math.floor(G*6),bm:ev.rb?Math.min(ev.rb[0],2.5):0,bd:ev.rb?Math.round(ev.rb[1]*.5):0};R.evBusy=false;

    '<button class="opt risk" data-act="risk"><b>'+ev.ra+'</b><span>'+Math.round(ev.rp*100)+'% chance · +'+fmt(R.evVals.risk)+' 🪙'+(ev.rb?' + ⚡x'+R.evVals.bm+' for '+R.evVals.bd+'s':'')+'</span></button>');
  sfx.scroll();

function resolveDecree(risky){
  if(R.evBusy||!R.ev)return;R.evBusy=true;
  var ev=R.ev,vals=R.evVals;
  if(!risky){finishDecree(true,false,vals.safe);return;}
  $('modal').firstChild.innerHTML='<div class="dice">🎲</div><h2>Fortune decides…</h2><p>'+ev.ra+'</p>';
  tone(300,.7,'sawtooth',.03,500);
  setTimeout(function(){var win=Math.random()<ev.rp;finishDecree(win,true,win?vals.risk:vals.cons);},950);
}
function finishDecree(win,risky,amt){
  var ev=R.ev;
  gain(amt);S.decrees++;qInc('dec');R.decreeT=rnd(100,160);
  if(win&&risky&&ev.rb)applyBoost(R.evVals.bm,R.evVals.bd);
  if(win&&risky){confetti(W/2,H*.4,90);sfx.win();R.shake=10;}else if(!risky){sfx.bless();}else sfx.fail();
  coinBurst(W/2,H*.42,win&&risky?26:12);
  var title=win&&risky?'🎉 It paid off!':risky?'😅 Not this time':'✅ Wise choice';
  showModal('<div class="big">'+(win&&risky?'🤩':risky?'😅':ev.e)+'</div><h2>'+title+'</h2><div class="rew">+'+fmt(amt)+' 🪙</div>'+
    (win&&risky&&ev.rb?'<div class="streak">⚡ x'+R.evVals.bm+' income for '+R.evVals.bd+'s!</div>':'')+
    '<button class="opt safe" data-act="close"><b>Continue</b></button>');

var K={hv:.1,hf:3,hl:60,eb:0,et:600,mb:120,re:.38,mg:1.25,mc:1.27,fg:.012,hb:.04,ac:.03,rbm:150,rr:.6,rv:.6,rm:1.0,lsc:60,off:1,wd:.015};
var RIV=[
 {n:'Valdrak the Unbroken',e:'🐲'},{n:'Queen Mirelle',e:'👑'},{n:'Orlan Stormcaller',e:'⛈️'},{n:'The Sunken Crown',e:'🔱'},
 {n:'Lady Ashgrove',e:'🌳'},{n:'Thane Brogar',e:'🪓'},{n:'Zephyra Windborne',e:'🌬️'},{n:'The Ivory Court',e:'🦢'},
 {n:'Captain Ilsa Rook',e:'🏴‍☠️'},{n:'Kaelen of the Spires',e:'🗼'},{n:'Duchess Orvane',e:'🦚'},{n:'The Tarn Clans',e:'⛰️'},
 {n:'Sir Pell Hightide',e:'🌊'},{n:'The Amber League',e:'🟠'},{n:'Nyx Aurelian',e:'🌙'},{n:'Baron Quillfeather',e:'🪶'},
 {n:'Isle of Tessaly',e:'🏝️'},{n:'Marrow Hollow',e:'🦴'},{n:'High Priest Anuun',e:'🔔'},{n:'Cloudwright Guild',e:'⚙️'},
 {n:'Tomas Lanternjack',e:'🏮'},{n:'Wren of Pale Harbor',e:'⚓'},{n:'Grimmel Ironkettle',e:'🍲'},{n:'Little Pip Skyland',e:'🎈'}];
for(var ri=0;ri<RIV.length;ri++)RIV[ri].tk=150*Math.pow(120,(23-ri)/23);
var REF=[[60,34],[120,106],[240,444],[480,1722],[900,4200],[1800,5373],[2700,6048],[3600,10227],[5400,16176],[7200,19815],[10800,26208],[14400,33381],[18000,40522],[21600,47872]];
var TOWA=[200,340,160,20,270];
function mmss(t){t=Math.max(0,Math.ceil(t));return ((t/60)|0)+':'+('0'+(t%60)).slice(-2);}
function refAt(t){
  t=Math.max(t,REF[0][0]);
  var i=1;while(i<REF.length-1&&REF[i][0]<t)i++;
  var a=REF[i-1],b=REF[i];
  var u=(Math.log(t)-Math.log(a[0]))/(Math.log(b[0])-Math.log(a[0]));
  return Math.exp(Math.log(a[1])+(Math.log(b[1])-Math.log(a[1]))*u);
}
function powerOf(){return Math.floor(Math.sqrt(Math.max(0,S.life))*(1+0.5*Math.tanh(S.glory/100)));}
function rivalPow(k){
  var tk=RIV[k].tk,p=K.rm*refAt(tk)*Math.pow(Math.max(S.play,30)/tk,K.re);
  var sb=R.sb[k];if(sb&&S.play<sb)p*=.88;
  return p;
}
var LG=[{n:'Bronze',e:'🥉',lo:21,hi:25},{n:'Silver',e:'🥈',lo:16,hi:20},{n:'Gold',e:'🥇',lo:11,hi:15},{n:'Crystal',e:'💎',lo:6,hi:10},{n:'Sky',e:'☁️',lo:2,hi:5},{n:'Sovereign',e:'👑',lo:1,hi:1}];
function leagueOf(r){for(var i=LG.length-1;i>=0;i--)if(r<=LG[i].hi)return i;return 0;}
function floorRank(){return S.peakL>=1?LG[S.peakL-1].hi:25;}
function renown(){return powerOf()*S.stand;}
function rivEff(k,me){var p=rivalPow(k);if(S.conq[k]||p>me)return p;return me*(1.0005+.0002*(23-k));}
function rawRank(){var me=renown(),r=1;for(var k=0;k<RIV.length;k++)if(rivEff(k,me)>me)r++;return r;}
function computeRank(){var r=rawRank(),f=floorRank();return r>f?f:r;}
function standings(){
  var L=[],k;
  var me0=renown();
  for(k=0;k<RIV.length;k++)L.push({k:k,n:RIV[k].n,e:RIV[k].e,p:rivalPow(k),x:rivEff(k,me0),me:false});
  L.sort(function(a,b){return b.x-a.x;});
  L.splice(computeRank()-1,0,{k:-1,n:'Your Realm',e:'🌤️',p:Math.floor(renown()),me:true});
  return L;
}
function mm(){return 0.6+0.9*S.mood/100;}
function mightOf(l){return l<=0?0:30*eff(l);}
function myMight(){return mightOf(S.mil)*mm()*(R.fgB||1);}
function milCost(l){return Math.floor(K.mb*Math.pow(K.mc,l));}
function winsTotal(){return (S.wins|0)+((S.ar&&S.ar.w)|0);}
function milReq(L){return L<9?0:Math.floor((L-8)*1.2);}
function milCap(){return 8+Math.floor(winsTotal()/1.2);}
function reqLevel(life,rho){return Math.max(1,Math.round(rho*Math.log(life/K.lsc+1)/Math.log(K.mg)-K.off));}
function rivalLevel(k){var p=rivalPow(k);return reqLevel(p*p,K.rv);}
function rivalMight(k){return mightOf(rivalLevel(k))*1.0;}
var ST=[{n:'Skiffs',e:'⛵'},{n:'Mages',e:'🔮'},{n:'Cannons',e:'💣'}];
var TAC=[{n:'Charge',e:'🔥',m:1.12,l:2,d:'+12% might · double losses'},{n:'Steady',e:'⚖️',m:1,l:1,d:'balanced'},{n:'Cautious',e:'🛡️',m:.94,l:.5,d:'−6% might · half losses'}];
function rivSt(k){return (k*5+2)%3;}
function counterMult(a,b){if(a===b||b<0)return 1;return b===(a+1)%3?1.5:b===(a+2)%3?.67:1;}
function rollAct(k){if(S.lastSt>=0&&Math.random()<.5)return (S.lastSt+2)%3;return Math.random()<.75?rivSt(k):(rivSt(k)+1+((Math.random()*2)|0))%3;}
function duelPower(st,tac,act){return myMight()*(1+.12*S.units[st])*counterMult(st,act)*TAC[tac].m;}
function duelOddsFull(k,st,tac,act){var A=duelPower(st,tac,act),D=rivalMight(k);if(A<=0)return 0;var r=A/D,r3=r*r*r;return r3/(1+r3);}
function duelOdds(k){var b=0;for(var j=0;j<3;j++){var o=duelOddsFull(k,j,1,rivSt(k));if(o>b)b=o;}return b;}
function scoutCost(){return Math.max(R.ips,2)*20;}
function towerCount(){return S.mil<=0?0:Math.min(5,1+Math.floor(S.mil/5));}

function buyMil(){
  var c=milCost(S.mil);
  if(S.mil>=milCap()){sfx.fail();var nd0=milReq(S.mil+1)-winsTotal();banner('⚔️ Garrison Lv '+(S.mil+1)+' locked','Win '+nd0+' more duel'+(nd0>1?'s':''),'Duels earn the gold and glory to grow your army');return false;}
  if(S.gold<c){sfx.fail();return false;}
  S.gold-=c;S.mil++;
  var a=TOWA[0]*Math.PI/180;
  spark(cx+Math.cos(a)*.95*170*s,cy+R.bob,'#ff9d9d',12,170);
  sfx.buy();
  if(S.mil%5===0){confetti(cx,cy,30);sfx.win();banner('⚔️ Garrison Lv '+S.mil,'×1.5 MIGHT!','A new tower rises');}
  qInc('mil');calc();renderSheet(true);save();

}
function raidStrength(){

}
function startRaid(){

  R.ship={x:dir>0?W+60*s:-60*s,y:H*.14,dir:dir,mode:'in',a:1};

function resolveRaid(){

    coinBurst(W/2,H*.3,14);sfx.win();

  }else{
    S.raidsLost++;
    var loss=Math.max(0,S.gold*.18);S.gold-=loss;S.mood=Math.max(0,S.mood-9);R.shake=14;
    spark(cx,cy-20*s,'#ff6a3d',30,260);

    lossCard('🏴‍☠️ Raiders struck!','They stole 🪙 '+fmt(loss)+'. Strengthen your Garrison to hold the next raid.',nd);
  }

function moveShip(dt){
  var sh=R.ship;if(!sh)return;
  if(sh.mode==='in'){var tx=cx+sh.dir*170*s,ty=H*.17;sh.x+=(tx-sh.x)*Math.min(1,dt*.35);sh.y+=(ty-sh.y)*Math.min(1,dt*.35);}
  else{sh.x+=sh.dir*150*s*dt;sh.y-=14*s*dt;sh.a-=dt*.35;if(sh.a<=0||sh.x>W+120*s||sh.x<-120*s)R.ship=null;}
}
function cannonFx(dt){
  R.cannonT-=dt;

    var n=towerCount(),i=n?((Math.random()*n)|0):0,a=TOWA[i]*Math.PI/180;
    var tx=cx+Math.cos(a)*.95*170*s,ty=cy+Math.sin(a)*.95*62*s-30*s+R.bob;
    spark(tx,ty,'#ffb347',8,200);ring(tx,ty,'rgba(255,200,100,1)',24);
    if(R.ship)spark(R.ship.x+rnd(-20,20)*s,R.ship.y+rnd(-10,10)*s,'#ff6a3d',10,220);
    tone(120+Math.random()*60,.15,'sawtooth',.05,-60);

function trainCost(i){return Math.floor(Math.max(60,R.ips*7)*Math.pow(1.2,S.units[i]));}
function trainN(i,n){var k=0;while(k<n&&S.units[i]<20&&S.gold>=trainCost(i)){S.gold-=trainCost(i);S.units[i]++;k++;}if(k){sfx.buy();save();}else sfx.fail();return k;}
function trainUnit(i){
  if(S.units[i]>=20||S.gold<trainCost(i)){sfx.fail();return false;}
  S.gold-=trainCost(i);S.units[i]++;sfx.buy();save();return true;
}
function duelResolve(k,st,tac,act){
  if(st===undefined||st<0){st=0;var bo=-1;for(var j=0;j<3;j++){var o=duelOddsFull(k,j,1,rivSt(k));if(o>bo){bo=o;st=j;}}}
  if(tac===undefined)tac=1;
  if(act===undefined||act<0)act=rollAct(k);
  var A=duelPower(st,tac,act)*rnd(.9,1.1),D=rivalMight(k),r=A/Math.max(D,1e-9),p=r*r*r/(1+r*r*r),win=Math.random()<p;
  var res={win:win,p:p,spoils:0,glory:0,first:false,loss:0,act:act,st:st,tac:tac,chest:-1,tr:0,rk0:computeRank(),oldTr:S.ar.tr,oldAr:arenaRank(S.ar.tr)};
  S.lastSt=st;
  S.seen[k]=1;
  if(win){
    S.wins++;res.first=!S.conq[k];S.conq[k]=1;res.glory=res.first?5:1.5;S.glory+=res.glory;
    res.spoils=Math.max(R.ips,2)*(10+(23-k)*.8)*(res.first?2:.5)*(R.acB||1);gain(res.spoils);
    res.tr=Math.round((14+(23-k)*.6)*(res.first?2:1));S.ar.tr+=res.tr;S.ar.best=Math.max(S.ar.best,S.ar.tr);R.sb[k]=S.play+600;
    var cr=Math.random();res.chest=res.first?2:cr<.25?1:cr<.7?0:-1;
    if(res.chest>=0&&!addChest(res.chest))res.chest=-2;
    qInc('win');
  }else{res.loss=Math.max(0,S.gold*.03*TAC[tac].l);S.gold-=res.loss;res.tr=-Math.min(S.ar.tr,8);S.ar.tr+=res.tr;}
  res.rk1=computeRank();res.newAr=arenaRank(S.ar.tr);
  return res;
}

function leagueBand(t){var lo=0,hi=ARL[1].t,i;for(i=0;i<ARL.length;i++)if(t>=ARL[i].t){lo=ARL[i].t;hi=ARL[i+1]?ARL[i+1].t:ARL[i].t+1500;}return [lo,hi];}
function gainRow(tr,oldTr,oldAr,newAr,gold,extraRank){
  R.pendClimb={tr:tr,oldTr:oldTr,oldAr:oldAr,newAr:newAr,gold:gold};
  var up=newAr<oldAr,dn=newAr>oldAr,b=leagueBand(oldTr),w0=clamp((oldTr-b[0])/(b[1]-b[0])*100,0,100);
  return '<div class="climb"><div class="cl-top"><div class="cl-box"><small>RANK</small><b id="clR">#'+oldAr.toLocaleString()+'</b><span id="clD" class="cl-d '+(up?'up':dn?'dn':'')+'">'+(up?'▲':dn?'▼':'＝')+'</span></div>'+
   '<div class="cl-box"><small>TROPHIES</small><b id="clT">'+fmt(oldTr)+'</b><span class="cl-d '+(tr>=0?'up':'dn')+'">'+(tr>=0?'+':'')+tr+' 🏆</span></div></div>'+
   '<div class="cl-bar"><i id="clB" style="width:'+w0+'%"></i></div><div class="cl-passed" id="clP"></div>'+(gold>0?'<div class="cl-gold" id="clG">+'+fmt(gold)+' 🪙</div>':'')+'</div>'+(extraRank||'');
}
function climbGo(){var o=R.pendClimb;R.pendClimb=null;if(o)setTimeout(function(){climbRun(o);},320);}
function climbRun(o){
  var el=$('clR');if(!el)return;
  var t0=performance.now(),dur=1900,up=o.newAr<o.oldAr,n=Math.min(4,Math.abs(o.oldAr-o.newAr)),chips=[],i;
  if(up&&n>0)for(i=0;i<n;i++){var rk=o.newAr+Math.floor((o.oldAr-o.newAr-1)*(1-i/Math.max(1,n))*(.5+.5*Math.random()))+0;rk=clamp(rk,o.newAr,o.oldAr-1);var pp=AP[ARK[rk-1]]||AP[ARK[0]];chips.push('<span class="cl-chip">▲ passed '+pp.e+' '+pp.n+' <em>#'+rk.toLocaleString()+'</em></span>');}
  var shown=0,tk=0;
  function step(now){
    var u=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-u,3),rk=Math.round(o.oldAr+(o.newAr-o.oldAr)*e),tr=Math.round(o.oldTr+o.tr*e);
    var re=$('clR');if(!re)return;
    re.textContent='#'+rk.toLocaleString();var te=$('clT');if(te)te.textContent=fmt(Math.max(0,tr));
    var b=leagueBand(Math.max(0,tr)),bi=$('clB');if(bi)bi.style.width=clamp((Math.max(0,tr)-b[0])/(b[1]-b[0])*100,0,100)+'%';
    while(shown<chips.length&&u>(shown+1)/(chips.length+1)){var pe=$('clP');if(pe){pe.insertAdjacentHTML('beforeend',chips[shown]);}tone(500+shown*160,.1,'sine',.05,160);shown++;}
    if(now-tk>70&&u<1){tk=now;tone(300+u*500,.04,'square',.015,0);}
    if(u<1)requestAnimationFrame(step);
    else{re.classList.add('done');if(up){confetti(W/2,H*.35,70);sfx.win();}}
  }
  requestAnimationFrame(step);
}

  var lg=leagueOf(R.rank),prot=rawRank()>floorRank();

  for(i=0;i<L.length;i++){
    if(!show[i])continue;

    }
    h+='<div class="lb'+(e.me?' me':'')+'"><span class="rk">#'+(i+1)+'</span><span class="av">'+e.e+'</span><span class="nm">'+e.n+(S.conq[e.k]?' ✔':'')+'</span><span class="pw">'+fmt(e.p)+'</span>'+btn+'</div>';
  }
  if(mi>0){var nx=L[mi-1];h+='<p class="gapt">'+(S.conq[nx.k]?'Next: outgrow '+nx.n:'⚔️ Defeat <b>'+nx.n+'</b> in an expedition to pass them')+'</p>';}

function applyAbsence(away){

  rep.sa=S.stand;

    var n=Math.min(4,Math.floor(away/7200)),t0=nowMs()-away*1000;
    for(i=0;i<n;i++){
      var ti=t0+(i+1)*7200000;

      var str=raidStrength(),mine=mightOf(S.mil)*mm();

      else{rep.lost++;S.shieldUntil=ti+8*3600000;}
    }
  }
  S.gold+=rep.vault;gain(rep.loot);S.glory+=rep.glory;
  if(rep.lost){rep.loss=Math.min(S.gold,S.gold*(1-Math.pow(.92,rep.lost)));S.gold-=rep.loss;}

  rep.ra=computeRank();

  R.rank=rep.ra;
  return rep;
}

/* ---------- simulation tick ---------- */
function tick(dt){
  R.T+=dt;
  calc();
  gain(R.ipsEff*dt);
  S.mood+=(R.moodT-S.mood)*Math.min(1,dt*.5);
  S.play+=dt;
  if(R.duelCd>0)R.duelCd=Math.max(0,R.duelCd-dt);
  R.raidT-=dt;
  if(!R.raid&&R.raidT<=25&&R.raidT>0)startRaid();
  if(R.raid&&R.raidT<=0)resolveRaid();
  if(R.ship)moveShip(dt);
  if(R.cannonT>0)cannonFx(dt);
  R.rankT-=dt;if(R.rankT<=0){R.rankT=.5;updateRank();}
  if(S.stand<1)S.stand=Math.min(1,S.stand+dt*.00042);
  R.sess+=dt;R.energy=Math.min(12,R.energy+dt*1.2);
  if(R.dblT>0)R.dblT=Math.max(0,R.dblT-dt);if(R.dblCd>0)R.dblCd=Math.max(0,R.dblCd-dt);
  if(R.holding&&!R.modalOpen&&!R.arena){R.holdT-=dt;if(R.holdT<=0){R.holdT=.2;tapHeart();}}
  if(!R.storm&&!R.raid&&S.play>360&&!R.arena){R.stormT-=dt;if(R.stormT<=0)startStorm();}
  if(R.storm){R.storm.t-=dt;if(R.storm.t<=0)resolveStorm();}
  R.stormA+=((R.storm?1:0)-R.stormA)*Math.min(1,dt*1.5);
  R.qbT-=dt;if(R.qbT<=0){R.qbT=.3;renderQuick();}
  if(S.taps<3){R.tipT-=dt;if(R.tipT<=0){R.tipT=1.3;ring(cx,cy+R.bob,'rgba(255,255,160,.9)',72);}}
  if(R.pendCard&&!R.modalOpen&&!R.arena){var pcd=R.pendCard;R.pendCard=null;showModal(pcd);}
  if(!R.softShown&&R.sess>=600&&!R.arena)softStop();
  R.slowT-=dt;
  if(R.slowT<=0){
    R.slowT=1;tokenTick();ensureQuests();updateHubLive();
    if(!R.modalOpen&&!R.arena){var sm=checkSeason();if(sm)showModal(sm+'<button class="opt safe" data-act="close"><b>Continue</b></button>');}
  }

  if(R.boostT>0){R.boostT-=dt;if(R.boostT<=0){R.boostT=0;R.boostMult=1;}}
  R.tapAnim=Math.max(0,R.tapAnim-dt*5);
  R.shake*=Math.pow(.02,dt);if(R.shake<.2)R.shake=0;
  R.bumpT=Math.max(0,R.bumpT-dt);
  R.dispGold+=(S.gold-R.dispGold)*Math.min(1,dt*10);
  if(Math.abs(S.gold-R.dispGold)<.5)R.dispGold=S.gold;
  while(S.era<ERA_TH.length-1&&S.life>=ERA_TH[S.era+1])eraUp();
  var i;
  for(i=0;i<6;i++){var v=PV[i];v.pop=Math.max(0,v.pop-dt*2.2);v.drop=Math.max(0,v.drop-dt*2.6);}
  /* blessing */
  if(R.bless){
    var b=R.bless;b.t+=dt;b.x+=b.dir*b.sp*dt;b.y=b.y0+Math.sin(b.t*2+b.ph)*28*s;
    spark(b.x,b.y,pick(['#fff6b0','#ffd34d','#ffffff']),1,40);
    if((b.dir>0&&b.x>W+60*s)||(b.dir<0&&b.x<-60*s)){R.bless=null;R.blessT=rnd(40,80);}
  }else if(!R.modalOpen){
    R.blessT-=dt;if(R.blessT<=0)spawnBlessing();
  }
  /* decree */
  if(!R.decreeReady&&!R.modalOpen){R.decreeT-=dt;if(R.decreeT<=0){R.decreeReady=true;sfx.scroll();}}
  /* ambient life */
  R.birdT-=dt;
  if(R.birdT<=0){R.birdT=rnd(25,50);if(R.day>.45){var bd=Math.random()<.5?1:-1,by0=H*rnd(.18,.38),bn=(3+Math.random()*3)|0;for(i=0;i<bn;i++)sp({k:'bird',x:(bd>0?-30:W+30)-bd*i*22*s,y:by0+rnd(-14,14)*s,vx:bd*rnd(50,66)*s,vy:rnd(-4,4)*s,ph:rnd(0,TAU),sz:rnd(5,7)*s,life:60,max:60});}}
  R.starT-=dt;
  if(R.starT<=0){R.starT=rnd(10,25);if(R.night>.5)sp({k:'streak',x:rnd(.2,.9)*W,y:rnd(.05,.25)*H,vx:-rnd(260,380)*s,vy:rnd(120,200)*s,life:.7,max:.7});}
  /* citizens */
  syncCitizens();
  for(i=0;i<CIT.length;i++){
    var c=CIT[i];
    if(c.pop>0)c.pop=Math.max(0,c.pop-dt*2);
    if(c.jump>0)c.jump=Math.max(0,c.jump-dt*2.4);
    if(c.tum>0)c.tum=Math.max(0,c.tum-dt);
    if(c.w>0){c.w-=dt;if(c.w<=0){var a=rnd(0,TAU),r=Math.sqrt(Math.random())*.78;c.tu=Math.cos(a)*r;c.tv=Math.sin(a)*r;}}
    else{
      var du=c.tu-c.u,dv=c.tv-c.v,dd=Math.hypot(du,dv);
      if(dd<.03){c.w=rnd(.6,3);}else{var st=Math.min(dd,.13*dt);c.u+=du/dd*st;c.v+=dv/dd*st;}
    }
  }
  /* idle feedback: coins drip from buildings, smoke, motes */
  R.dripT-=dt;
  if(R.dripT<=0){
    R.dripT=rnd(.7,1.3);
    var bl=[];for(i=0;i<6;i++)if(S.plots[i].type)bl.push(i);
    if(bl.length){var pi2=pick(bl);coinFly(PV[pi2].x,PV[pi2].y-30*s+R.bob);}
  }
  R.smokeT-=dt;
  if(R.smokeT<=0){
    R.smokeT=.5;
    for(i=0;i<6;i++){var pp=S.plots[i];if(pp.type==='house'&&pp.lvl>=2&&Math.random()<.5)sp({k:'smoke',x:PV[i].x+10*s,y:PV[i].y-(30+Math.min(3,(pp.lvl/5)|0)*13)*s+R.bob,vx:rnd(-4,6)*s,vy:-16*s,life:1.8,max:1.8,sz:4*s});}
  }
  R.moteT-=dt;
  if(R.moteT<=0){R.moteT=.3-R.night*.15;sp({k:'spark',x:cx+rnd(-190,190)*s,y:cy+rnd(-60,50)*s,vx:rnd(-8,8)*s,vy:rnd(-22,-6)*s,life:rnd(1.5,2.5),max:2.5,sz:rnd(1.5,2.8)*s,c:R.night>.4?'#ffe9a0':'rgba(255,255,255,.8)'});}
  /* particles */
  for(i=P.length-1;i>=0;i--){
    var p=P[i];
    if(p.k==='coin'){
      p.t+=dt;p.life-=dt;
      if(p.t<p.hom){p.vy+=800*s*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
      else{
        var dx=R.hx-p.x,dy=R.hy-p.y,f=Math.min(1,dt*9);p.x+=dx*f;p.y+=dy*f;
        if(dx*dx+dy*dy<400){bump();P.splice(i,1);continue;}
      }
      if(p.life<=0)P.splice(i,1);
      continue;
    }
    p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}
    if(p.k==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*s*dt;p.vx*=.98;}
    else if(p.k==='conf'){p.vy+=420*s*dt;p.vx*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
    else if(p.k==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.k==='text'){p.y+=p.vy*dt;p.vy*=.96;}
    else if(p.k==='bird'){p.x+=p.vx*dt;p.y+=p.vy*dt+Math.sin(R.T*2+p.ph)*8*dt*s;if(p.x>W+60||p.x<-60)P.splice(i,1);}
    else if(p.k==='streak'){p.x+=p.vx*dt;p.y+=p.vy*dt;}
  }
  /* housekeeping */
  R.hudT-=dt;
  if(R.hudT<=0){R.hudT=.08;checkAsp();updateHUD();renderSheet(false);}
  R.saveT-=dt;if(R.saveT<=0){R.saveT=15;save();}
  R.scoreT-=dt;if(R.scoreT<=0){R.scoreT=25;var pw0=powerOf();if(pw0>(S.best||0))S.best=pw0;flushScore();}
  if(((R.T*2)|0)%10===0)measureHud();
}

/* ---------- main loop ---------- */
var lastTs=0,errShown=false;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=lastTs?Math.min(.05,Math.max(0,(ts-lastTs)/1000)):.016;lastTs=ts;
  if(!R.paused){
    try{
      var sdt=dt;if(R.slow>0){R.slow-=dt;sdt=dt*.35;}
      if(R.ready)tick(sdt);else R.T+=dt;
      if(R.arena){arenaStep(dt);arenaDraw();}else render();
    }catch(err){
      if(!errShown){errShown=true;try{console.error('Skyrealm error:',err);}catch(e){}}
    }
  }
  if(!R.fr){R.fr=true;ytCall('game','firstFrameReady');}
}
function finishBoot(){
  calc();R.dispGold=S.gold;S.mood=clamp(S.mood,0,100);
  syncCitizens();CIT.forEach(function(c){c.pop=0;});
  R.rank=computeRank();R.raidT=(S.raidsHeld+S.raidsLost>0||S.play>600)?rnd(150,240):rnd(140,170);
  R.ready=true;R.loaded=true;
  updateHUD();
  var sp=document.getElementById('splash');if(sp)sp.classList.add('off');
  setTimeout(function(){if(sp&&sp.parentNode)sp.parentNode.removeChild(sp);ytCall('game','gameReady');},400);
  checkAway();
}
function boot(){
  initSystem();
  acv=$('arena');actx=acv.getContext('2d');initArena();bindArena();
  resize();bindInput();
  requestAnimationFrame(loop);
  loadSave().then(function(d){
    applySave(d);
    R.awayFrom=(d&&+d.lastSeen)?+d.lastSeen:nowMs();
    finishBoot();
  }).catch(function(){finishBoot();});
}
boot();
})();
</script>
